<style>
:root{
  --bg:#F5F6FB; --ink:#141A33; --muted:#5B6280; --line:#DDE1EE;
  --teal:#2B56E0; --tealSoft:#E4EAFD; --gold:#E0A100; --goldSoft:#FFF3D1;
  --red:#D7263D; --redSoft:#FCE3E6; --surface:#FFFFFF; --lane:#F4E6CF;
  --btn:#2B56E0; --ball:#2B56E0; --pin:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1230; --ink:#EEF1FF; --muted:#98A0C4; --line:#2A3263;
    --teal:#8EAEFF; --tealSoft:#1D2759; --gold:#FFC93D; --goldSoft:#3A3016;
    --red:#FF5C6C; --redSoft:#3F1A2A; --surface:#151B42; --lane:#1B2250;
    --btn:#3D66F2; --ball:#4F77FF; --pin:#F7F7FB;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1230; --ink:#EEF1FF; --muted:#98A0C4; --line:#2A3263;
    --teal:#8EAEFF; --tealSoft:#1D2759; --gold:#FFC93D; --goldSoft:#3A3016;
    --red:#FF5C6C; --redSoft:#3F1A2A; --surface:#151B42; --lane:#1B2250;
    --btn:#3D66F2; --ball:#4F77FF; --pin:#F7F7FB;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 96px}
h1,h2,.display{font-family:"Bowlby One",Impact,"Arial Black",sans-serif;font-weight:400;letter-spacing:.01em;margin:0}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 0 18px;border-bottom:3px solid var(--ink)}
header.top h1{font-size:clamp(2rem,9vw,3.1rem);line-height:.95}
header.top h1 .amp{color:var(--red)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:clamp(48px,12vw,68px);height:auto;flex:none}
.teamname{font-weight:800;color:var(--teal);font-size:1rem;margin-top:6px;background:none;border:0;padding:0;cursor:pointer;font-family:inherit;text-align:left}
.mode{font-size:.78rem;color:var(--muted);text-align:right}
nav.tabs{display:flex;gap:6px;margin:18px 0 20px;overflow-x:auto}
nav.tabs button{flex:1;min-width:max-content;border:2px solid var(--ink);background:transparent;color:var(--ink);font:800 .95rem Figtree,sans-serif;padding:9px 14px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{border:0;background:var(--btn);color:#fff;font-weight:800;padding:12px 18px;border-radius:12px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--teal);border:2px solid var(--teal)}
.btn.danger{background:transparent;color:var(--red);border:2px solid var(--red);padding:8px 12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label.field{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem;color:var(--muted)}
input[type=text],input[type=date],input[type=number]{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);width:100%}
input:focus{border-color:var(--teal);outline:none}
.muted{color:var(--muted)}
.empty{border:2px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;color:var(--muted)}

/* Last night spotlight */
.spot{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.medal{border-radius:18px;padding:16px;position:relative;overflow:hidden}
.medal.hero{background:var(--goldSoft);border:2px solid var(--gold)}
.medal.chump{background:var(--redSoft);border:2px solid var(--red)}
.medal .kind{font-family:"Bowlby One",Impact,sans-serif;font-size:1.5rem;line-height:1}
.medal.hero .kind{color:var(--gold)}
.medal.chump .kind{color:var(--red)}
.medal .who{font-weight:800;font-size:1.15rem;margin-top:10px;word-break:break-word}
.medal .sc{color:var(--muted);font-size:.88rem}
.medal svg{position:absolute;right:-6px;bottom:-8px;width:64px;height:64px;opacity:.22}

/* Standings */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;border:2px solid var(--ink);border-radius:16px;background:var(--surface)}
th,td{padding:11px 10px;text-align:right;white-space:nowrap}
th{font-size:.8rem;color:var(--muted);font-weight:600;border-bottom:2px solid var(--ink)}
th:first-child,td:first-child{text-align:left}
tbody tr+tr td{border-top:1px solid var(--line)}
td.name{font-weight:800}
.pill{display:inline-block;min-width:2em;text-align:center;border-radius:999px;padding:1px 8px;font-weight:800}
.pill.h{background:var(--goldSoft);color:var(--ink)}
.pill.c{background:var(--redSoft);color:var(--ink)}
.net.pos{color:var(--teal);font-weight:800}
.net.neg{color:var(--red);font-weight:800}
h2{font-size:1.35rem;margin:26px 0 12px}

/* Score entry: the lane */
.lane{background:var(--lane);border-radius:18px;padding:14px;border:2px solid var(--line)}
.grid{display:grid;gap:8px;align-items:center}
.grid .hd{font-size:.8rem;color:var(--muted);font-weight:600;text-align:center}
.grid .bn{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid input{text-align:center;padding:10px 4px;font-weight:800;font-variant-numeric:tabular-nums}
.grid input.bad{border-color:var(--red)}
.hint{font-size:.85rem;color:var(--muted);margin:10px 2px 0}

/* History */
.night{border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;background:var(--surface)}
.night .date{font-weight:800}
.games{display:grid;gap:6px;margin-top:10px}
.game{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem}
.game b{font-weight:800}
.tag{font-weight:800}
.tag.h{color:var(--gold)}
.tag.c{color:var(--red)}

/* Team */
.bowler{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.bowler span{font-weight:800}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:90vw;z-index:20;transition:opacity .2s}
.toast[hidden]{display:none}
.ro{background:var(--tealSoft);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* v2: live scoring */
.mode .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:middle}
.livebar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.livebar .date{font-weight:800;font-size:1.1rem}
.gtabs{display:flex;gap:8px;margin-bottom:12px}
.gtabs button{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 6px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.gtabs button small{font-weight:600;color:var(--muted);font-size:.78rem}
.gtabs button[aria-selected="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.gtabs button[aria-selected="true"] small{color:var(--bg);opacity:.8}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{border:2px solid var(--line);border-radius:999px;padding:7px 12px;background:var(--surface);font-weight:800;white-space:nowrap;cursor:pointer;display:flex;gap:8px;align-items:center}
.chip span{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--teal);background:var(--tealSoft)}
.frames{display:grid;grid-template-columns:repeat(9,1fr) 1.5fr;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--surface)}
.fr{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.fr:first-child{border-left:0}
.fr .no{font-size:.66rem;color:var(--muted);text-align:center;border-bottom:1px solid var(--line);line-height:1.6}
.fr .mk{display:flex;height:24px}
.fr .mk span{flex:1;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;border-bottom:1px solid var(--line)}
.fr .mk span+span{border-left:1px solid var(--line)}
.fr .mk .x{color:var(--red)}
.fr .mk .sp{color:var(--teal)}
.fr .cum{text-align:center;font-weight:800;min-height:30px;line-height:30px;font-variant-numeric:tabular-nums;font-size:.95rem}
.fr.cur{background:var(--goldSoft)}
.frames.small .fr .mk{height:18px}.frames.small .fr .mk span{font-size:.72rem}.frames.small .fr .cum{min-height:22px;line-height:22px;font-size:.8rem}.frames.small .fr .no{display:none}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad button{padding:15px 0;font:800 1.3rem Figtree,system-ui,sans-serif;border-radius:12px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;touch-action:manipulation}
.pad button:active:not(:disabled){transform:scale(.96)}
.pad .strike{background:var(--red);border-color:var(--red);color:#fff}
.pad .spare{background:var(--btn);border-color:var(--btn);color:#fff}
.pad button:disabled{opacity:.25;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--teal);font-weight:600;cursor:pointer;padding:6px 0;text-decoration:underline}
.linkbtn.danger{color:var(--red)}
.autosw{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:.9rem;color:var(--muted)}
.autosw input{width:18px;height:18px;accent-color:var(--teal)}
.tally td small{display:block;font-size:.7rem;color:var(--muted);line-height:1}
.tally th.on,.tally td.on{background:var(--tealSoft)}
.tally .teamrow td{border-top:2px solid var(--ink);font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{border:2px solid var(--ink);border-radius:14px;padding:12px;background:var(--surface)}
.stats b{display:block;font-family:"Bowlby One",Impact,sans-serif;font-weight:400;font-size:1.4rem;line-height:1.1}
.stats span{font-size:.82rem;color:var(--muted)}
details.quick{margin-top:22px}
details summary{cursor:pointer;font-weight:600;color:var(--teal)}
.sheets{margin-top:12px}
.hsg{margin-top:10px}
.hsrow{display:grid;grid-template-columns:72px 1fr;gap:8px;align-items:center;margin-top:6px}
.hsrow>span{font-weight:600;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}


/* v5: bowler cards + jar */
.livebar{align-items:flex-end}
.jarnow{text-align:right}
.jarnow span{display:block;font-size:.85rem;color:var(--muted)}
.jarnow b{font-family:"Bowlby One",Impact,sans-serif;font-weight:400;font-size:1.6rem;line-height:1;color:var(--gold)}
.jarnow b.neg{color:var(--red)}
.bcard{border:2px solid var(--line);border-radius:18px;background:var(--surface);padding:14px;margin-bottom:12px;scroll-margin-top:12px}
.bcard.open{border-color:var(--teal)}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.bhead h3{margin:0;font-family:"Bowlby One",Impact,sans-serif;font-weight:400;font-size:1.3rem;letter-spacing:.01em}
.bjar{font-weight:800;font-variant-numeric:tabular-nums}
.bjar.pos{color:var(--teal)}.bjar.neg{color:var(--red)}
.gscores{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:8px}
.gs{display:flex;flex-direction:column;gap:3px}
.gl{font-size:.75rem;color:var(--muted);font-weight:600;text-align:center}
.gs.on .gl{color:var(--teal);font-weight:800}
.gin{text-align:center;font-weight:800;padding:9px 4px!important;font-variant-numeric:tabular-nums}
.gs.on .gin{border-color:var(--teal)}
.gin.bad{border-color:var(--red)!important}
.gv{background:var(--tealSoft);border:2px solid transparent;border-radius:10px;padding:7px 4px;font-weight:800;cursor:pointer;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.15}
.gs.on .gv{border-color:var(--teal)}
.gv small{display:block;font-size:.66rem;color:var(--muted);font-weight:600}
.gs.ser b{display:flex;align-items:center;justify-content:center;min-height:42px;font-size:1.05rem;font-variant-numeric:tabular-nums}
.framesbtn{display:block;margin-top:6px;font-size:.88rem}
.scorewrap{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.jrow:first-of-type{margin-top:4px}
.padwrap{margin-top:12px;padding:12px;border-radius:14px;background:var(--lane)}
.jrow{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:start;margin-top:12px}
.jt{font-size:.8rem;font-weight:800;color:var(--muted);padding-top:9px}
.jbs{display:flex;flex-wrap:wrap;gap:6px}
.jb{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:0;border-radius:10px;padding:6px 10px;cursor:pointer;border:2px solid;line-height:1.2;touch-action:manipulation;text-align:left}
.jb:active{transform:scale(.96)}
.jb.f{background:var(--redSoft);border-color:transparent;color:var(--ink)}
.jb.w{background:var(--goldSoft);border-color:transparent;color:var(--ink)}
.jb.buy{background:transparent;border-color:var(--teal);color:var(--teal);flex-direction:row;gap:8px;align-items:center}
.jl{font-weight:800;font-size:.85rem}
.ja{font-size:.75rem;color:var(--muted);font-weight:600}
.jb.f .ja{color:var(--red)}
.jc{position:absolute;top:-8px;right:-6px;background:var(--ink);color:var(--bg);font-size:.7rem;font-weight:800;border-radius:999px;padding:1px 6px}
.bfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.paidb{font-size:.88rem;font-weight:600;color:var(--teal)}
td.jar{font-weight:800}
td.jar.pos{color:var(--teal)}td.jar.neg{color:var(--red)}
td.jar small{display:block;font-size:.7rem;color:var(--muted);font-weight:600}
.jarhead{border:2px solid var(--ink);border-radius:18px;padding:16px 18px;background:var(--goldSoft);margin-bottom:14px}
.jarbal{font-family:"Bowlby One",Impact,sans-serif;font-size:2.6rem;line-height:1.05;margin:4px 0}
.jarbal.neg{color:var(--red)}
.rules{border:2px solid var(--line);border-radius:16px;padding:14px;background:var(--surface)}
.rhead{display:flex;flex-direction:column;margin:16px 0 4px}
.rhead:first-child{margin-top:0}
.rhead .muted{font-size:.82rem}
.rulerow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:.95rem}
.rulerow b{white-space:nowrap;font-variant-numeric:tabular-nums}
.rulerow input[type=checkbox]{width:20px;height:20px;accent-color:var(--teal);flex:none}
.amtin{display:flex;align-items:center;gap:4px;font-weight:800}
.amtin input{width:86px;text-align:right}
.jarline{margin:6px 0 0;font-size:.9rem}
</style>

<body>
<div class="wrap" id="root"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>(()=>{
let S={team:'Our Team',games:3,jar:{},bigSplitPot:false,bowlers:[],nights:[],live:null,pinRequired:false};
const FINES=[
  {k:'gutter1',label:'Gutter ball, 1st ball',short:'Gutter 1st'},
  {k:'gutter2',label:'Gutter ball, 2nd ball',short:'Gutter 2nd'},
  {k:'openSingle',label:'Open on a single-pin spare',short:'Missed 1-pin'},
  {k:'foul',label:'Foul line violation',short:'Foul'},
  {k:'splitCaused',label:'Split caused (7-10 or Greek Church)',short:'Big split left'}];
const BOUNTIES=[
  {k:'splitConv',label:'Split conversion',short:'Split made'},
  {k:'bigSplitConv',label:'Big split conversion (7-10, Greek Church, 4-6-7-10)',short:'Big split made'},
  {k:'fourBagger',label:'Four-bagger (Ham Turkey)',short:'4-bagger'},
  {k:'clutch10',label:'Clutch 10th: strike or mark out',short:'Clutch 10th'}];
FINES.forEach(r=>r.fine=true);BOUNTIES.forEach(r=>r.fine=false);
const EXTRA=[{k:'chump',label:'Chump of the game (added when the night is saved)',short:'Chumps',fine:true},{k:'buyin',label:'Buy-in per bowler before Game 1',short:'Buy-ins',fine:true,buyin:true}];
const RULES=[...FINES,...BOUNTIES,...EXTRA];
const RULE=Object.fromEntries(RULES.map(r=>[r.k,r]));
const VIEWS=['tonight','standings','jar','history','team'];
let view=VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):'tonight';
let loaded=false,loadError=false,busy=false,draft=null,quickOpen=false,editJar=false;
let lg=0,sel=null,padFor=null,ov={},ver=0,flushing=false,flushT=null,pendingJar=[],removedJar={};
let auto=false,showScores=false;try{auto=localStorage.getItem('ch-auto')==='1';showScores=localStorage.getItem('ch-scores')==='1'}catch(e){}
const root=document.getElementById('root');
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nameOf=id=>{const b=S.bowlers.find(x=>x.id===id);return b?b.name:'Former bowler'};
function today(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function fmtDate(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}
const money=n=>'$'+(Math.round(Math.abs(n)*100)/100).toFixed(2);
const short$=n=>n<1&&n>0?Math.round(n*100)+'¢':money(n);
const smoney=n=>(n>0?'+':n<0?'−':'')+money(n);
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3000)}
const getPin=()=>{try{return localStorage.getItem('ch-pin')||''}catch(e){return ''}};
const setPin=p=>{try{localStorage.setItem('ch-pin',p)}catch(e){}};
const typing=()=>{const a=document.activeElement;return a&&a.tagName==='INPUT'&&a.type!=='checkbox'};

// What the next ball can be. {done:true} once the game is over.
function nextBall(r){
  let i=0;
  for(let f=0;f<9;f++){
    if(i>=r.length) return {max:10,frame:f,ball:0};
    if(r[i]===10){i++;continue}
    if(i+1>=r.length) return {max:10-r[i],frame:f,ball:1};
    i+=2;
  }
  const t=r.slice(i);
  if(t.length===0) return {max:10,frame:9,ball:0};
  if(t.length===1) return {max:t[0]===10?10:10-t[0],frame:9,ball:1};
  if(t.length===2){
    if(t[0]===10) return {max:t[1]===10?10:10-t[1],frame:9,ball:2};
    if(t[0]+t[1]===10) return {max:10,frame:9,ball:2};
  }
  return {done:true};
}
// Frame marks plus running score. total = score through the last frame that can be scored.
function scoreGame(r){
  const d=v=>v===0?'-':String(v), fr=[];
  let i=0,cum=0,ok=true;
  for(let f=0;f<9;f++){
    if(i>=r.length){fr.push({m:[],c:null});ok=false;continue}
    let m,pts=null,adv;
    if(r[i]===10){m=['','X'];adv=1;if(i+2<r.length)pts=10+r[i+1]+r[i+2]}
    else if(i+1<r.length){adv=2;
      if(r[i]+r[i+1]===10){m=[d(r[i]),'/'];if(i+2<r.length)pts=10+r[i+2]}
      else{m=[d(r[i]),d(r[i+1])];pts=r[i]+r[i+1]}}
    else{m=[d(r[i]),''];adv=1}
    if(pts===null)ok=false;
    if(ok){cum+=pts;fr.push({m,c:cum})}else fr.push({m,c:null});
    i+=adv;
  }
  const t=r.slice(i),m=[];
  if(t.length>0)m.push(t[0]===10?'X':d(t[0]));
  if(t.length>1)m.push(t[0]===10?(t[1]===10?'X':d(t[1])):(t[0]+t[1]===10?'/':d(t[1])));
  if(t.length>2){if(t[0]===10&&t[1]!==10)m.push(t[1]+t[2]===10?'/':d(t[2]));else m.push(t[2]===10?'X':d(t[2]))}
  const complete=!!nextBall(r).done;
  if(complete&&ok){cum+=t.reduce((a,b)=>a+b,0);fr.push({m,c:cum})}else fr.push({m,c:null});
  return {frames:fr,total:cum,complete,thru:fr.filter(f=>f.c!==null).length};
}


// ---- server ----
async function post(payload,retried){
  try{
    const r=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json','x-team-pin':getPin()},body:JSON.stringify(payload)});
    const d=await r.json().catch(()=>({}));
    if(r.status===401&&!retried){const p=prompt('Enter your team PIN to save');if(p){setPin(p.trim());return post(payload,true)}return {ok:false,d:{error:'Saving needs the team PIN.'}}}
    return {ok:r.ok,d};
  }catch(e){return {ok:false,d:{error:'No connection. Try again.'}}}
}
async function act(payload,msg){
  if(busy)return false;busy=true;
  const x=await post(payload);busy=false;
  if(!x.ok){toast(x.d.error||'Could not save. Try again.');return false}
  S=x.d;render();if(msg)toast(msg);return true;
}
// Saves without redrawing while someone is typing, so focus isn't lost.
async function quiet(payload,errMsg){
  const x=await post(payload);
  if(!x.ok){toast(x.d.error||errMsg||'Could not save. Try again.');load();return false}
  S=x.d;if(!typing())render();return true;
}
async function load(){
  try{
    const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw 0;
    const d=await r.json();
    if(root.querySelector('.grid'))draft=readDraft();
    S=d;loaded=true;loadError=false;render();
  }catch(e){loadError=true;if(!loaded)render()}
}

// ---- live frames (saved per bowler + game) ----
function getLive(b,g){const k=b+':'+g;if(ov[k])return ov[k];const x=S.live&&S.live.rolls[k];if(!x)return {rolls:[]};return Array.isArray(x)?{rolls:x}:{rolls:x.r||[]}}
const getRolls=(b,g)=>getLive(b,g).rolls;
function setRolls(b,g,r){ov[b+':'+g]={rolls:r,ver:++ver,dirty:true};clearTimeout(flushT);flushT=setTimeout(flush,250)}
async function flush(){
  if(flushing)return;flushing=true;
  for(;;){
    const k=Object.keys(ov).find(k=>ov[k].dirty);if(!k)break;
    const o=ov[k];o.dirty=false;const v=o.ver;const [b,g]=k.split(':');
    const x=await post({action:'setRolls',bowlerId:b,game:+g,rolls:o.rolls});
    if(x.ok){S=x.d;if(ov[k]&&ov[k].ver===v)delete ov[k]}
    else{toast(x.d.error||'Could not save that roll.');delete ov[k];break}
  }
  flushing=false;if(!typing())render();
}
function advance(){
  const ids=S.bowlers.map(b=>b.id);const i=ids.indexOf(sel);
  for(let s=1;s<=ids.length;s++){const id=ids[(i+s)%ids.length];if(!nextBall(getRolls(id,lg)).done){sel=padFor=id;return}}
}
function roll(n){
  const r=getRolls(sel,lg).slice(),nb=nextBall(r);
  if(nb.done||n>nb.max)return;
  r.push(n);setRolls(sel,lg,r);
  const after=nextBall(r);
  if(auto&&(after.done||after.frame!==nb.frame)){advance();render();const c=$('card-'+sel);if(c)c.scrollIntoView({behavior:'smooth',block:'start'});return}
  render();
}
// A game's score: frames if scored frame by frame, otherwise the typed total.
function gameScore(b,g){
  const r=getRolls(b,g);
  if(r.length){const s=scoreGame(r);return {v:s.total,frames:true,complete:s.complete,thru:s.thru}}
  const t=S.live&&S.live.totals?S.live.totals[b+':'+g]:undefined;
  return typeof t==='number'?{v:t,frames:false,complete:true}:null;
}

// ---- Chump & Hero Jar ----
const amt=k=>+((S.jar||{})[k])||0;
const isIn=k=>!RULE[k]||RULE[k].fine;
function liveJar(){if(!S.live)return [];return (S.live.jar||[]).filter(e=>!removedJar[e.id]).concat(pendingJar)}
function allEvents(includeLive){
  const ev=[];S.nights.forEach(n=>(n.jarEvents||[]).forEach(e=>ev.push(e)));
  if(includeLive)liveJar().forEach(e=>ev.push(e));return ev;
}
function jarBalance(){return allEvents(true).reduce((s,e)=>s+(isIn(e.k)?e.amt:-e.amt),0)}
function bowlerJar(evs,b){let paid=0,won=0,buy=0;evs.forEach(e=>{if(e.b!==b)return;if(e.k==='buyin')buy+=e.amt;else if(isIn(e.k))paid+=e.amt;else won+=e.amt});return {paid,won,buy,net:won-paid}}
function tapAmount(k){if(k==='bigSplitConv'&&S.bigSplitPot)return Math.max(0,jarBalance());return amt(k)}
async function addJar(b,k){
  const a=tapAmount(k);
  const tmp={id:'tmp'+(++ver),b,k,g:lg,amt:a,at:Date.now(),pending:true};
  pendingJar.push(tmp);render();
  const R=RULE[k];toast(`${nameOf(b)}: ${R.short}. ${R.fine?'Pay':'Collect'} ${money(a)}`);
  const x=await post({action:'addJar',bowlerId:b,k,game:lg,amt:a});
  pendingJar=pendingJar.filter(e=>e!==tmp);
  if(x.ok)S=x.d;else toast(x.d.error||'Could not save that.');
  if(!typing())render();
}
async function removeJar(e){
  if(e.pending)return;
  removedJar[e.id]=1;render();
  const x=await post({action:'removeJar',id:e.id});
  if(x.ok)S=x.d;else toast(x.d.error||'Could not undo that.');
  delete removedJar[e.id];if(!typing())render();
}

// ---- Chump & Hero ----
function judge(night){
  const out=[];
  for(let g=0;g<S.games;g++){
    const e=[];Object.keys(night.scores).forEach(id=>{const v=night.scores[id][g];if(typeof v==='number')e.push({id,v})});
    if(e.length<2){out.push(null);continue}
    const max=Math.max(...e.map(x=>x.v)),min=Math.min(...e.map(x=>x.v));
    if(max===min){out.push({heroes:[],chumps:[],max,min,tie:true});continue}
    out.push({heroes:e.filter(x=>x.v===max).map(x=>x.id),chumps:e.filter(x=>x.v===min).map(x=>x.id),max,min});
  }
  return out;
}
function standings(){
  const t={};S.bowlers.forEach(b=>t[b.id]={id:b.id,name:b.name,h:0,c:0,games:0,pins:0,high:0});
  S.nights.forEach(n=>{
    Object.keys(n.scores).forEach(id=>{if(!t[id])return;n.scores[id].forEach(v=>{if(typeof v==='number'){t[id].games++;t[id].pins+=v;if(v>t[id].high)t[id].high=v}})});
    judge(n).forEach(j=>{if(!j)return;j.heroes.forEach(id=>{if(t[id])t[id].h++});j.chumps.forEach(id=>{if(t[id])t[id].c++})});
  });
  return Object.values(t).sort((a,b)=>(b.h-b.c)-(a.h-a.c)||b.h-a.h||(b.games?b.pins/b.games:0)-(a.games?a.pins/a.games:0));
}

  h+=`<h2>Who’s paying</h2><div class="tablewrap"><table><thead><tr><th>Bowler</th><th>Fines</th><th>Bounties</th><th>Net</th>${anyBuy?'<th>Buy-ins</th>':''}</tr></thead><tbody>`;
  S.bowlers.map(b=>({b,J:bowlerJar(ev,b.id)})).sort((a,c)=>c.J.net-a.J.net).forEach(({b,J})=>{h+=`<tr><td class="name">${esc(b.name)}</td><td>${money(J.paid)}</td><td>${money(J.won)}</td><td class="net ${J.net>0?'pos':J.net<0?'neg':''}">${smoney(J.net)}</td>${anyBuy?`<td>${money(J.buy)}</td>`:''}</tr>`});
  h+=`</tbody></table></div><p class="hint">Net is bounties collected minus fines paid. Buy-ins seed the jar and don’t count against anyone.</p>`;
  const stat=RULES.filter(R=>ev.some(e=>e.k===R.k));
  h+=`<h2>Jar stats</h2><div class="tablewrap"><table><thead><tr><th>Bowler</th>${stat.map(R=>`<th>${R.short}</th>`).join('')}</tr></thead><tbody>`;
  S.bowlers.forEach(b=>{h+=`<tr><td class="name">${esc(b.name)}</td>${stat.map(R=>{const n=ev.filter(e=>e.b===b.id&&e.k===R.k).length;return `<td>${n?`<span class="pill ${R.fine?'c':'h'}">${n}</span>`:'–'}</td>`}).join('')}</tr>`});
  return h+`</tbody></table></div><p class="hint">Includes tonight while a night is in progress.</p>`;
}
function vHistory(){
  if(!S.nights.length)return '<div class="empty"><p><b>Nothing here yet.</b></p><p>Every night you save lands here, newest first.</p></div>';
  return '<h2 style="margin-top:4px">History</h2>'+S.nights.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created).map(n=>{
    let gs='';
    judge(n).forEach((x,i)=>{
      if(!x){gs+=`<div class="game"><b>G${i+1}</b><span class="muted">Not enough scores</span></div>`;return}
      if(x.tie){gs+=`<div class="game"><b>G${i+1}</b><span class="muted">Everyone tied at ${x.max}</span></div>`;return}
      gs+=`<div class="game"><b>G${i+1}</b><span><span class="tag h">Hero</span> ${x.heroes.map(id=>esc(nameOf(id))).join(' & ')} (${x.max})</span><span><span class="tag c">Chump</span> ${x.chumps.map(id=>esc(nameOf(id))).join(' & ')} (${x.min})</span></div>`;
    });
    let sheets='';
    if(n.rolls){for(let g=0;g<S.games;g++){const ids=Object.keys(n.rolls).filter(id=>n.rolls[id][g]);if(!ids.length)continue;sheets+=`<div class="hsg"><b>Game ${g+1}</b>`+ids.map(id=>`<div class="hsrow"><span>${esc(nameOf(id))}</span>${sheet(scoreGame(n.rolls[id][g]),null,true)}</div>`).join('')+'</div>'}}
    const ev=n.jarEvents||[];let jar='';
    if(ev.length){
      const tin=ev.filter(e=>isIn(e.k)).reduce((a,e)=>a+e.amt,0),tout=ev.filter(e=>!isIn(e.k)).reduce((a,e)=>a+e.amt,0);
      const per={};ev.forEach(e=>{(per[e.b]=per[e.b]||{})[e.k]=(per[e.b][e.k]||0)+1});
      jar=`<details class="sheets"><summary>Jar: ${money(tin)} in, ${money(tout)} out</summary>`+Object.keys(per).map(b=>`<p class="jarline"><b>${esc(nameOf(b))}</b> ${Object.keys(per[b]).map(k=>`${RULE[k]?RULE[k].short:k}${per[b][k]>1?' ×'+per[b][k]:''}`).join(', ')}</p>`).join('')+'</details>';
    }
    return `<div class="night"><div class="row" style="justify-content:space-between"><span class="date">${esc(fmtDate(n.date))}</span><button class="btn danger" data-del="${n.id}">Delete</button></div><div class="games">${gs}</div>${jar}${sheets?`<details class="sheets"><summary>Scoresheets</summary>${sheets}</details>`:''}</div>`;
  }).join('');
}
function vTeam(){
  const list=S.bowlers.length?S.bowlers.map(b=>`<div class="bowler"><span>${esc(b.name)}</span><button class="btn danger" data-rm="${b.id}">Remove</button></div>`).join(''):'<p class="muted">No bowlers yet.</p>';
  return `<h2 style="margin-top:4px">Bowlers</h2><p class="hint" style="margin-top:0">Bowlers appear in this order on bowl night.</p>${list}<div class="row" style="margin-top:14px"><input type="text" id="newName" placeholder="Bowler name" maxlength="30" style="flex:1;min-width:160px"><button class="btn" id="addB">Add bowler</button></div>`+
    `<h2>League settings</h2><label class="field" style="max-width:220px">Games per night<input type="number" id="setGames" min="1" max="5" value="${S.games}"></label><p class="hint">Saves as soon as you change it. Jar fines and bounties are set on the Jar tab.</p>`+
    (S.pinRequired?`<h2>Team PIN</h2><p class="hint" style="margin-top:0">Your team requires a PIN to make changes. This phone asks for it the first time you save. Use this if the PIN changed.</p><button class="btn ghost" id="changePin">Change PIN on this phone</button>`:'');
}
function readDraft(){
  const d={date:($('nDate')||{}).value||today(),scores:{}};
  root.querySelectorAll('.grid input').forEach(inp=>{const b=inp.dataset.b,g=+inp.dataset.g;if(!d.scores[b])d.scores[b]=Array(S.games).fill(null);const v=inp.value.trim();d.scores[b][g]=v===''?null:Math.round(+v)});
  return d;
}
function wire(){
  const all=(q,f)=>root.querySelectorAll(q).forEach(f);
  all('[data-view]',b=>b.onclick=()=>{if(root.querySelector('.grid'))draft=readDraft();view=b.dataset.view;editJar=false;try{history.replaceState(null,'','#'+view)}catch(e){}render()});
  all('[data-go]',b=>b.onclick=()=>{view=b.dataset.go;render()});
  if($('retry'))$('retry').onclick=load;
  if($('renameTeam'))$('renameTeam').onclick=()=>{const n=prompt('Team name',S.team);if(n&&n.trim())act({action:'settings',team:n.trim()},'Team renamed')};
  if($('quick'))$('quick').ontoggle=()=>{quickOpen=$('quick').open};
  if($('startLive'))$('startLive').onclick=()=>{lg=0;padFor=null;act({action:'startNight',date:$('liveDate').value||today()},'Night started. Good luck!')};
  if($('saveNight'))$('saveNight').onclick=()=>{
    const d=readDraft(),clean={};let bad=false;
    all('.grid input',inp=>{const v=inp.value.trim();const ok=v===''||(+v>=0&&+v<=300);inp.classList.toggle('bad',!ok);if(!ok)bad=true});
    if(bad){toast('Scores must be between 0 and 300.');return}
    Object.keys(d.scores).forEach(id=>{if(d.scores[id].some(v=>typeof v==='number'))clean[id]=d.scores[id]});
    if(Object.keys(clean).length<2){toast('Enter scores for at least two bowlers.');return}
    draft=d;act({action:'addNight',date:d.date,scores:clean},'Scores saved').then(ok=>{if(ok){draft=null;quickOpen=false;view='standings';render()}});
  };
  // live night
  all('[data-g]',b=>b.onclick=()=>{lg=+b.dataset.g;render()});
  all('[data-frames]',b=>b.onclick=()=>{lg=+b.dataset.fg;padFor=sel=b.dataset.frames;render()});
  if($('closePad'))$('closePad').onclick=()=>{padFor=null;render()};
  all('[data-pins]',b=>b.onclick=()=>roll(+b.dataset.pins));
  if($('undo'))$('undo').onclick=()=>{const r=getRolls(sel,lg);if(r.length){setRolls(sel,lg,r.slice(0,-1));render()}};
  if($('nextB'))$('nextB').onclick=()=>{advance();render()};
  if($('scoreSw'))$('scoreSw').onchange=e=>{showScores=e.target.checked;if(!showScores)padFor=null;try{localStorage.setItem('ch-scores',showScores?'1':'0')}catch(x){}render()};
  if($('autoSw'))$('autoSw').onchange=e=>{auto=e.target.checked;try{localStorage.setItem('ch-auto',auto?'1':'0')}catch(x){}render()};
  all('[data-tb]',inp=>{
    inp.onchange=()=>{
      const v=inp.value.trim(),b=inp.dataset.tb,g=+inp.dataset.tg;
      if(v!==''&&!(+v>=0&&+v<=300)){inp.classList.add('bad');toast('Scores must be between 0 and 300.');return}
      inp.classList.remove('bad');
      const t=v===''?null:Math.round(+v);
      if(!S.live.totals)S.live.totals={};
      if(t===null)delete S.live.totals[b+':'+g];else S.live.totals[b+':'+g]=t;
      quiet({action:'setTotal',bowlerId:b,game:g,total:t},'Could not save that score.');
    };
    inp.onkeydown=e=>{if(e.key==='Enter')inp.blur()};
    inp.onblur=()=>setTimeout(()=>{if(!typing())render()},50);
  });
  all('[data-add]',b=>b.onclick=()=>addJar(b.dataset.b,b.dataset.add));
  all('[data-undojar]',b=>b.onclick=()=>{const e=liveJar().find(x=>x.id===b.dataset.undojar);if(e)removeJar(e)});
  if($('finishLive'))$('finishLive').onclick=async()=>{
    clearTimeout(flushT);await flush();
    const inc=[];S.bowlers.forEach(b=>{for(let g=0;g<S.games;g++){const r=getRolls(b.id,g);if(r.length&&!nextBall(r).done)inc.push(b.name+' G'+(g+1))}});
    if(!confirm(inc.length?`These frame-by-frame games aren’t finished and won’t count: ${inc.join(', ')}. Finish the night anyway?`:'Finish the night and add it to the standings?'))return;
    if(await act({action:'finishNight'},'Night saved')){lg=0;padFor=null;view='standings';render()}
  };
  if($('cancelLive'))$('cancelLive').onclick=()=>{if(confirm('Discard tonight’s scores and jar? This can’t be undone.')){ov={};pendingJar=[];act({action:'cancelNight'},'Night discarded')}};
  // jar settings
  if($('editJar'))$('editJar').onclick=()=>{editJar=true;render()};
  if($('cancelJar'))$('cancelJar').onclick=()=>{editJar=false;render()};
  if($('saveJar'))$('saveJar').onclick=async()=>{
    const jar={};all('[data-jar]',i=>{jar[i.dataset.jar]=Math.max(0,Math.round((+i.value||0)*4)/4)});
    if(await act({action:'settings',jar,bigSplitPot:$('potClean').checked},'Jar amounts saved')){editJar=false;render()}
  };
  // team
  if($('addB')){const add=()=>{const n=$('newName').value.trim();if(n)act({action:'addBowler',name:n},n+' added')};$('addB').onclick=add;$('newName').onkeydown=e=>{if(e.key==='Enter')add()}}
  all('[data-rm]',b=>b.onclick=()=>{const nm=nameOf(b.dataset.rm);if(confirm('Remove '+nm+'? Their past scores stay in history.'))act({action:'removeBowler',id:b.dataset.rm},nm+' removed')});
  all('[data-del]',b=>b.onclick=()=>{if(confirm('Delete this night?'))act({action:'deleteNight',id:b.dataset.del},'Night deleted')});
  if($('setGames'))$('setGames').onchange=()=>act({action:'settings',games:$('setGames').value},'Games per night saved');
  if($('changePin'))$('changePin').onclick=()=>{const p=prompt('Team PIN',getPin());if(p!==null){setPin(p.trim());toast('PIN saved on this phone')}};
}

render();load();
// Pull in teammates' updates: every 5s during a live night, every 20s otherwise.
let tick=0;
setInterval(()=>{
  tick++;
  if(document.hidden||busy||flushing||pendingJar.length||Object.keys(ov).length||typing())return;
  if(S.live||tick%4===0)load();
},5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
})();
</script>
</body>
</html>
